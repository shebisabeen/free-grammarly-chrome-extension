<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar-free</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:2px;">
        <img src="icons/icon48.png" alt="Grammar-free logo" style="height:1.4em;width:1.4em;vertical-align:middle;">
        <span style="font-size:1.4em;font-weight:bold;">Grammar-free</span>
      </div>
      <div style="display:flex;align-items:center;gap:3px;">
        <button id="homeBtn" type="button" title="Home" class="navBtn" style="background:none;border:none;cursor:pointer;font-size:1.3em;padding:4px;border-radius:6px;"><span role="img" aria-label="home">🏠</span></button>
        <button id="historyBtn" type="button" title="History" class="navBtn" style="background:none;border:none;cursor:pointer;font-size:1.3em;padding:4px;border-radius:6px;"><span role="img" aria-label="history">🕑</span></button>
        <button id="settingsBtn" type="button" title="Settings" class="navBtn" style="background:none;border:none;cursor:pointer;font-size:1.3em;padding:4px;border-radius:6px;"><span role="img" aria-label="settings">⚙️</span></button>
      </div>
    </div>
    <div id="mainSection">
      <textarea id="inputText" placeholder="Type your sentence here..."></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <button id="fixBtn" style="margin-bottom:0;">Fix Grammar</button>
        <a id="editCustomPromptLink" href="#" style="font-size:0.9em;color:#37b154;text-decoration:none;white-space:nowrap;">Edit Custom Prompt</a>
      </div>
      <textarea id="outputText" readonly placeholder="Corrected sentence will appear here..."></textarea>
      <button id="copyBtn">Copy Result</button>
      <div style="text-align:center; margin-top:8px;">
        <a href="https://gramboapp.com" target="_blank" class="footer-link">🍎 Download Mac App</a>
      </div>
    </div>
    <div id="historySection">
    </div>
    <div id="settingsSection">
      <label for="geminiKeyInput">Gemini API Key:</label>
      <input type="password" id="geminiKeyInput" placeholder="Enter your Gemini API key" style="width:97%; margin-bottom:6px;" />
      <button id="saveGeminiKeyBtn" type="button">Save Gemini Key</button>
      <span id="geminiKeyStatus" style="font-size:0.9em; margin-left:8px;"></span>
      <a href="https://aistudio.google.com/apikey" target="_blank" class="footer-link" style="display:block;margin-top:6px;">
        🔑 Generate Gemini API Key
      </a>
      
      <div style="margin-top:16px;">
        <label for="customPromptInput">Custom Prompt (Optional):</label>
        <textarea id="customPromptInput" placeholder="Add custom instructions here (e.g., 'Use formal tone', 'British English')" style="width:93%; min-height:60px; margin-top:6px;"></textarea>
        <button id="saveCustomPromptBtn" type="button">Save Custom Prompt</button>
        <span id="customPromptStatus" style="font-size:0.9em; margin-left:8px;"></span>
      </div>
      <div class="settings-footer">
        <div class="version" id="versionInfo"></div>
        <div style="margin-top:6px;">
          <a href="https://profile.sabeencs.com" target="_blank" class="footer-link">🌐 Website</a>
          <a href="https://github.com/shebisabeen/free-grammar-chrome-extension" target="_blank" class="footer-link">🐙 GitHub</a>
        </div>
        <div style="margin-top:6px;">
          <a href="https://coff.ee/shebisabeen" target="_blank" class="footer-link">☕ Buy Me a Coffee</a>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
